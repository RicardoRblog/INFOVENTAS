    <script>
        // Mostrar fecha actual
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('fecha-actual').innerHTML = new Date().toLocaleDateString('es-ES', options);
        
        // Simular carga de datos
        document.addEventListener('DOMContentLoaded', function() {
            const estado = document.querySelector('.estado-sistema i');
            estado.style.color = '#4CAF50';

            estado.classList.add('fa-check-circle');
