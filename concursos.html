<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concurso | Puyo SA</title>
    <link rel="shortcut icon" href="IMG/LogoAzul.png">
    <link rel="stylesheet" href="css/estilosuper.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header-gerencial">
            <div class="contenedor-header">
                <div class="logo-titulo">
                    <a href="index.html" class="logo-link">
                        <i class=></i>
                        <img src="IMG/LogoAzul.png" alt="Logo Puyo SA" class="logo-img">
                    </a>
                </div>
            <div class="encabezado">
                <div class="titulos">
                    <h1>VENDEDOR</h1>
                    <p class="subtitulo">Sistema de Gestion Comercial</p>
                </div>    
            </div>

            <div class="info-panel">
                <span class="fecha-actual" id="fecha-actual"></span>
                <div class="estado-sistema">
                    <i class="fas fa-circle-notch"></i>
                    <span>ON LINE</span>
                </div>
            </div>
            </div>   
    </header>

    <main class="contenedor-principal">
       

        <div class="contenedor-informe-concursos">
            <div class="tarjeta-informe-concursos">
            
                
           <iframe 
                    src="https://drive.google.com/file/d/1-QBjAFele35fjeeJO7Ll_MjDNZmOSbiH/preview
" 
                    width="980px" 
                    height="600px" 
                    frameborder="1"
            ></iframe>
                     
            </div>
        </div>

        
    </main>

    <footer class="footer-empresarial">
        <div class="contenedor-footer">
            <p class="copy">&copy; <span id="current-year">2024</span> Puyo SA. Todos los derechos reservados.</p>
            <div class="enlaces-footer">
                <!-- Tus enlaces del footer aquí -->
            </div>
        </div>
    </footer>
    <script>
        // Mostrar fecha actual
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('fecha-actual').innerHTML = new Date().toLocaleDateString('es-ES', options);

        // Actualizar año en el footer
    document.getElementById('current-year').textContent = new Date().getFullYear();
    
        
        // Efecto hover para tarjetas
        const tarjetas = document.querySelectorAll('.tarjeta-acceso');
        tarjetas.forEach(tarjeta => {
            tarjeta.addEventListener('mouseenter', () => {
                tarjeta.style.transform = 'translateY(-5px)';
            });
            tarjeta.addEventListener('mouseleave', () => {
                tarjeta.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
